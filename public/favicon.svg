<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Arbitrage Monitor</title>
  <desc id="desc">Two opposing trade routes crossing through a central market node.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122b2b"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9af5c3"/>
      <stop offset="1" stop-color="#42cfa0"/>
    </linearGradient>
    <linearGradient id="gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe09a"/>
      <stop offset="1" stop-color="#d9943e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#66d9e7" stroke-opacity=".2"/>
  <path d="M13 24h26l-6-6m6 6-6 6" fill="none" stroke="url(#mint)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <path d="M51 40H25l6 6m-6-6 6-6" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <circle cx="32" cy="32" r="6" fill="#0b171c" stroke="#edf3f7" stroke-width="2"/>
  <circle cx="32" cy="32" r="2" fill="#66d9e7"/>
</svg>
